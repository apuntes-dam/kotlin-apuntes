site_name: Kotlin · Apuntes
site_description: Apuntes de Kotlin siguiendo la estructura de la UD 1 (primer programa).
site_url: https://dopemmanuel.github.io/kotlin-apuntes/
repo_url: https://github.com/dopemmanuel/kotlin-apuntes
repo_name: GitHub
theme:
  name: material
  language: es
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: slate
      primary: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo claro
    - scheme: default
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo oscuro
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy
    - search.highlight
extra_css:
  - assets/extra.css
  - assets/lenguajes.css
extra_javascript:
  - assets/lenguajes.js
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
nav:
  - Inicio: index.md
  - "U1: Primer programa en Kotlin":
      - u01/index.md
      - "1.1 Un programa": u01/01-programa.md
      - "1.2 Práctica con el lenguaje": u01/02-lenguaje.md
      - "1.3 Tipos de datos": u01/03-tipos.md
      - "1.4 Pruebas con kotlin.test": u01/04-pruebas.md
      - "1.5 Entorno: JDK, IntelliJ y kotlinc": u01/05-entorno.md
      - "1.6 Bucles: for y forEach": u01/06-bucles.md
      - "Prácticas": u01/practicas.md
  - Ejercicios de Programación:
      - ejercicios/index.md
      - "P1.2 Primeros programas": ejercicios/p1-2.md
      - "P2.1 Condicionales": ejercicios/p2-1.md
      - "P2.2 Bucles": ejercicios/p2-2.md
      - "P2.3 Excepciones": ejercicios/p2-3.md
      - "P2.4 Depurar": ejercicios/p2-4.md
  - Ejercicios U3 a U5:
      - ejercicios-u3-u5/index.md
      - "U3.0 · Cadenas": ejercicios-u3-u5/u3-0.md
      - "U3.1 · Listas y tuplas": ejercicios-u3-u5/u3-1.md
      - "U3.2 · Mapas (diccionarios)": ejercicios-u3-u5/u3-2.md
      - "U3.3 · Conjuntos": ejercicios-u3-u5/u3-3.md
      - "U3.4 · JSON": ejercicios-u3-u5/u3-4.md
      - "U3.5 · XML": ejercicios-u3-u5/u3-5.md
      - "U4.1 · Repaso de las unidades 1 a 3": ejercicios-u3-u5/u4-1.md
      - "U4.2 · POO I (ejercicios 1 al 5)": ejercicios-u3-u5/u4-2.md
      - "U4.3 · POO II (ejercicios 6 al 10)": ejercicios-u3-u5/u4-3.md
      - "U4.4 · Robots (parte 1)": ejercicios-u3-u5/u4-4.md
      - "U4.5 · Robots (parte 2 y reto)": ejercicios-u3-u5/u4-5.md
      - "U4.6 · Prueba: Cafetera y Taza": ejercicios-u3-u5/u4-6.md
      - "U4.7 · Juego del ahorcado (grupos)": ejercicios-u3-u5/u4-7.md
      - "U4.8 · Cambio de rol: explícamelo tú (grupos)": ejercicios-u3-u5/u4-8.md
      - "U5.1 · Clases abstractas, interfaces y herencia": ejercicios-u3-u5/u5-1.md
